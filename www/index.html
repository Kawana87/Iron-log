<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Iron Log</title>
<style>
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
</style>
<style>
/* VOICE: a lifter's logbook: direct, numeric, no fuss
   IDEA: the loaded barbell; every lift shows the plates to put on
   PICTURE: today's session is the page, with a plate stack per lift
   COLOUR/TYPE: iron charcoal bands, chalk white, competition-plate red; Barlow Condensed numbers + Inter
   LAYOUT: one 720px column, sticky header, tab bar under the thumb */
:root{color-scheme:light dark;--bg:light-dark(#f4f4f2,#0f1012);--card:light-dark(#fff,#1a1c20);--ink:light-dark(#141414,#ecebe7);--mut:light-dark(#5f6268,#9b9ea4);--line:light-dark(#e1e1dc,#2a2d33);--field:light-dark(#f1f1ee,#23262b);--red:light-dark(#c81f29,#ff4d52);--iron:#16181c}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
h1,h2,h3{text-wrap:balance}
.top{position:sticky;top:0;z-index:5;background:var(--iron);color:#f1f0ec;padding:calc(10px + env(safe-area-inset-top)) max(16px,4vw) 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 26px/1 'Barlow Condensed',sans-serif;display:flex;align-items:center;gap:10px}
.brand svg{width:38px;height:22px}
.sync{font-size:13px;color:#a9acb2;text-align:right}
main{max-width:720px;margin:0 auto;padding:16px max(16px,4vw) 24px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.hero{background:var(--iron);color:#f1f0ec;border-radius:16px;padding:20px 18px}
.pn{color:#ff5a5f;font-weight:600;font-size:14px}
.hero h1{font:700 clamp(38px,10vw,52px)/1.05 'Barlow Condensed',sans-serif;margin:4px 0 2px}
.hero .sub{color:#b9bcc2}
.meter{height:8px;background:#2c2f35;border-radius:4px;margin-top:16px;overflow:hidden}
.meter i{display:block;height:100%;background:#e0262e;transition:width .3s}
.mt{font-size:13px;color:#a9acb2;margin-top:6px}
.ex header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ex h3,.pg h3{font:700 26px/1.1 'Barlow Condensed',sans-serif;margin:0}
.tag{font:600 13px/1 Inter,sans-serif;background:var(--field);color:var(--mut);padding:5px 8px;border-radius:6px}
.scheme{margin-left:auto;font:600 19px/1.2 'Barlow Condensed',sans-serif;color:var(--mut);white-space:nowrap}
.bar{display:flex;align-items:center;gap:14px;margin:12px 0 8px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.sleeve{display:flex;align-items:center;gap:2px;height:46px;padding:0 18px 0 6px;background:linear-gradient(var(--mut),var(--mut)) center/100% 4px no-repeat}
.sleeve::before{content:'';width:5px;height:22px;background:var(--mut);border-radius:2px;margin-right:4px}
.sleeve i{width:9px;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35),inset -2px 0 0 rgba(0,0,0,.22)}
.set{display:grid;grid-template-columns:20px minmax(0,1.3fr) 12px minmax(0,1fr) minmax(0,1fr) 48px;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.set .n{color:var(--mut);font-size:13px;text-align:center}
.by{color:var(--mut);text-align:center}
.wu{position:relative}
.wu em{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:500 12px Inter,sans-serif;color:var(--mut);font-style:normal;pointer-events:none}
.set input{font:600 21px 'Barlow Condensed',sans-serif;width:100%;height:44px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px;padding:0 8px;text-align:center}
.wu input{padding-right:24px}
.hint{font-size:12px;color:var(--mut);line-height:1.2}
.hint b{color:var(--red);font-weight:600}
.chk{width:48px;height:44px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--mut);cursor:pointer;display:grid;place-items:center}
.chk svg{width:20px;height:20px}
.set.done .chk{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.set.done input{opacity:.6}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.big{min-height:56px;font-size:17px}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mut)}
.btn.danger{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acts{display:grid;gap:10px}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
textarea,select,.fld input{width:100%;font:16px Inter,sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
select,.fld input{height:46px}
.lab{display:block;font-weight:600;margin-bottom:6px}
.fld{display:grid;gap:6px;margin-top:12px}
.fld>span{font-size:14px;font-weight:500}
.fld .wu input{text-align:left}
.vh{font:700 34px/1.05 'Barlow Condensed',sans-serif;margin:6px 0 0}
.mut{color:var(--mut);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips span,.chips button{font:500 13px Inter,sans-serif;background:var(--field);color:var(--mut);padding:5px 9px;border-radius:999px;border:0}
.chips button{min-height:40px;padding:0 14px;cursor:pointer;font-size:14px}
.chips button.on{background:var(--ink);color:var(--bg)}
.pg p{margin:6px 0 12px}
.pg .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.run{color:var(--red);font-weight:600;font-size:14px}
.err{color:var(--red);font-size:14px;min-height:1em}
.log header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.log ul,.sum ul{list-style:none;padding:0;margin:10px 0 0}
.log li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.num{font-variant-numeric:tabular-nums;text-align:right;color:var(--mut)}
.note{font-size:14px;color:var(--mut);margin:8px 0 0;font-style:italic}
.cf{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;font-size:14px}
.sum{border-color:var(--red)}
.sum li{padding:3px 0}
.sumh{display:flex;justify-content:space-between;align-items:center}
.prs{color:var(--red);font-weight:600;margin:8px 0 0}
.plw{color:var(--red);font-weight:600}
.bnr{border-color:var(--red)}
.bnr p{margin:4px 0 10px}
.set.wset{padding:3px 0}
.set.wset .wv{font:600 19px/1 'Barlow Condensed',sans-serif;text-align:center;color:var(--mut);white-space:nowrap}
.set.wset .wv small{font:500 12px Inter,sans-serif}
.set.wset .n{font-weight:600}
.set.wset .chk{height:38px}
.set.xset .n{color:var(--red);font-weight:700}
.addset{margin-top:6px}
.tgl{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:8px;font-weight:500;cursor:pointer}
.tgl input{width:22px;height:22px;accent-color:var(--red)}
.wus{display:grid;grid-template-columns:20px minmax(0,1fr) 12px minmax(0,1fr) 44px;gap:8px;align-items:center;margin-top:8px}
.wus input{width:100%;height:44px;font:600 19px 'Barlow Condensed',sans-serif;text-align:center;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:0 34px 0 8px}
.wus .n{color:var(--mut);font-size:13px;text-align:center}
.wus .btn{padding:0;min-height:44px}
#xsheet{position:fixed;inset:0;z-index:9;display:grid;align-items:end}
#xsheet[hidden]{display:none}
.xsp{max-height:88vh;overflow:auto;overscroll-behavior:contain}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--field);padding:4px;border-radius:12px}
.seg button{min-height:42px;border:0;border-radius:9px;background:none;color:var(--mut);font:600 15px Inter,sans-serif;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.xg{border-top:1px solid var(--line)}
.xg summary{font-weight:600}
.xg summary::after{content:'+';margin-left:auto;color:var(--mut);font:400 22px Inter,sans-serif}
.xg[open] summary::after{content:'−'}
.xh{margin:6px 0 0;font-size:13px;color:var(--mut)}
.xi{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 2px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);font:500 16px Inter,sans-serif;text-align:left;cursor:pointer}
.xi small{color:var(--mut);font-size:13px;text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.exa{margin-top:2px;font-size:14px}
.lnk{background:none;border:0;padding:0;min-height:36px;color:var(--red);font:600 14px Inter,sans-serif;cursor:pointer}
.tag.sw{background:var(--red);color:#fff}
.lay h3{font:700 24px/1.1 'Barlow Condensed',sans-serif;margin:0 0 4px}
.lr{display:grid;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.lr .ln{font-weight:600}
.lr .ln small{display:block;color:var(--mut);font-size:13px;font-weight:400}
.lr .lb{display:grid;grid-template-columns:44px 44px minmax(0,1fr) 44px;gap:6px;align-items:center}
.lr .btn{padding:0;min-height:44px;font-size:17px}
.lr select{height:44px;padding:0 10px}
.tr{display:flex;align-items:center;gap:10px}
.sync{line-height:1.2;max-width:8em}
.brand{white-space:nowrap}
.sync{display:none}
#rsheet .chips{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
#rsheet .chips button{padding:0;min-height:42px}
.rbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid #3a3e45;background:#23262b;color:#f1f0ec;font:600 15px Inter,sans-serif;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap}
.rbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rbtn.on{background:#e0262e;border-color:#e0262e;color:#fff}
#rest .rtap{background:none;min-width:56px;height:auto;display:grid;text-align:left;padding:0 4px 0 0;line-height:1.1}
#rest.paused #restt{opacity:.55}
#rest{padding-left:12px}
#rsheet{position:fixed;inset:0;z-index:9;display:grid;align-items:end}
#rsheet[hidden]{display:none}
.rsb{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.rsp{position:relative;background:var(--card);color:var(--ink);border-radius:18px 18px 0 0;padding:14px max(16px,4vw) calc(20px + env(safe-area-inset-bottom));max-width:720px;width:100%;margin:0 auto;display:grid;gap:12px}
.rsh{display:flex;justify-content:space-between;align-items:center}
.rst{font:700 clamp(72px,22vw,104px)/1 'Barlow Condensed',sans-serif;text-align:center;font-variant-numeric:tabular-nums}
.rss{text-align:center;color:var(--mut);font-size:14px;margin-top:-6px}
.rsadj{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rsadj>div{display:grid;gap:6px;text-align:center}
.rsadj span{font-size:13px;color:var(--mut)}
.rsadj>div>div{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.rsadj .btn{min-height:52px;font-size:19px;padding:0}
#rsheet .chips{justify-content:center;margin:0}
.btn[disabled]{opacity:.45;cursor:default}
.edx{padding:8px 0;border-top:1px solid var(--line);margin-top:8px}
.eds{display:grid;grid-template-columns:20px minmax(0,1fr) 12px minmax(0,1fr);gap:8px;align-items:center;margin-top:6px}
.eds input{font:600 20px 'Barlow Condensed',sans-serif;width:100%;height:42px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px;padding:0 8px;text-align:center}
.eds input::placeholder{font:400 14px Inter,sans-serif}
.eds .n{color:var(--mut);font-size:13px;text-align:center}
body.resting{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.bar{background:none;border:0;padding:0;width:100%;font:inherit;font-size:13px;text-align:left;color:var(--mut);cursor:pointer;border-radius:10px}
.bar svg.mini{width:150px;height:50px;flex:none}
.pc svg.big{width:100%;height:auto;max-height:190px;display:block;margin:10px 0 4px}
.pcw{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:8px;align-items:center}
.pcw .btn{font-size:24px;padding:0;min-height:60px}
.pcw input{width:100%;height:60px;font:700 38px 'Barlow Condensed',sans-serif;text-align:center;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:0 34px 0 8px}
.pcr{font:700 24px/1.2 'Barlow Condensed',sans-serif;margin:0}
.inv .r{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.inv .dot{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(127,127,127,.6);flex:none}
.inv .c{font:700 24px 'Barlow Condensed',sans-serif;min-width:30px;text-align:center}
.inv .r .btn{min-width:44px;font-size:20px;padding:0}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:560px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font:700 30px/1.1 'Barlow Condensed',sans-serif;white-space:nowrap}
.stat span{font-size:13px;color:var(--mut)}
.fig{position:relative;height:260px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.empty h2{font:700 30px/1.1 'Barlow Condensed',sans-serif;margin:0 0 6px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:12px;color:var(--mut);text-decoration:none;min-height:58px}
.tabs a.on{color:var(--red)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));background:var(--iron);color:#fff;border-radius:999px;padding:6px 6px 6px 16px;display:flex;gap:6px;align-items:center;z-index:7;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#rest[hidden],#toast[hidden]{display:none}
#rest small{color:#a9acb2;font-size:12px}
#restt{font:700 26px 'Barlow Condensed',sans-serif;min-width:58px;font-variant-numeric:tabular-nums}
#rest button{background:#2c2f35;color:#fff;border:0;border-radius:999px;height:42px;min-width:46px;font:600 14px Inter,sans-serif;cursor:pointer}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:8;font-size:14px}
details summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
@media(prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><svg viewBox="0 0 38 22" aria-hidden="true"><rect x="0" y="10" width="38" height="2" fill="#a9acb2"/><rect x="5" y="5" width="3" height="12" rx="1" fill="#f1f0ec"/><rect x="9" y="2" width="5" height="18" rx="1" fill="#e0262e"/><rect x="24" y="2" width="5" height="18" rx="1" fill="#e0262e"/><rect x="30" y="5" width="3" height="12" rx="1" fill="#f1f0ec"/></svg>Iron Log</div>
  <div class="tr"><div class="sync" id="sync">Connecting…</div><button id="rbtn" class="rbtn" data-act="rsheet" aria-label="Rest timer"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span id="rbtnt">Rest</span></button></div>
</header>
<main id="main"><div class="card">Loading…</div></main>
<div id="rest" hidden role="timer" aria-live="off"><button class="rtap" data-act="rsheet" aria-label="Open rest timer"><small>Rest</small><span id="restt">0:00</span></button><button data-act="rest" data-d="-15" aria-label="15 seconds less">−15s</button><button data-act="rest" data-d="15" aria-label="15 seconds more">+15s</button><button data-act="rest" data-d="60" aria-label="One minute more">+1m</button><button data-act="rest" data-d="0" aria-label="Stop timer">Stop</button></div>
<div id="xsheet" hidden role="dialog" aria-modal="true" aria-label="Swap exercise"><div class="rsb" data-act="xclose"></div><div class="rsp xsp"><div class="rsh"><b id="xtitle">Swap exercise</b><button class="btn sm ghost" data-act="xclose">Close</button></div><div id="xbody"></div></div></div>
<div id="rsheet" hidden role="dialog" aria-modal="true" aria-label="Rest timer"><div class="rsb" data-act="rclose"></div><div class="rsp"><div class="rsh"><b>Rest timer</b><button class="btn sm ghost" data-act="rclose">Close</button></div><div id="rsbody"></div></div></div>
<div id="toast" hidden></div>
<nav class="tabs" id="tabs">
  <a href="#today" data-v="today"><svg viewBox="0 0 24 24"><path d="M2 12h20M5 8v8M8 6v12M16 6v12M19 8v8"/></svg>Today</a>
  <a href="#programs" data-v="programs"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Programs</a>
  <a href="#history" data-v="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</a>
  <a href="#progress" data-v="progress"><svg viewBox="0 0 24 24"><path d="M4 19l5-6 4 3 7-9"/></svg>Progress</a>
  <a href="#plates" data-v="plates"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>Plates</a>
  <a href="#prefs" data-v="prefs"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>Settings</a>
</nav>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- state ---------- */
const defaults=()=>({v:1,unit:'lb',round:5,bar:45,rest:180,active:null,progs:{},mem:{},draft:null,dr:{},wu:{on:true,rest:60,steps:[{p:0,r:5},{p:0,r:5},{p:40,r:5},{p:60,r:3},{p:80,r:2}]},pcw:0,inv:{lb:{55:0,45:8,35:1,25:1,10:2,5:1,2.5:1,1.25:0},kg:{25:8,20:1,15:1,10:1,5:1,2.5:1,2:0,1.5:0,1.25:1,1:0,0.5:0}}});
let P=defaults(),L=[];
try{const s=localStorage.getItem('ironlog.p');if(s)P={...defaults(),...JSON.parse(s)};const l=localStorage.getItem('ironlog.l');if(l)L=JSON.parse(l)}catch(e){}

const incUp=()=>P.unit==='lb'?5:2.5, incLow=()=>P.unit==='lb'?10:5;

function solve(w){w=+w;if(!(w>0))return null;const bar=+P.bar||0,side=(w-bar)/2;if(side<-1e-9)return{under:1,plates:[],made:bar,left:w-bar,up:null};

 return h}
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.in!=='impf'||!t.files||!t.files[0])return;const f=t.files[0],rd=new FileReader();rd.onload=()=>{const a=$('#impt');if(a){a.value=String(rd.result||'');ACT.imp()}};rd.onerror=()=>toast('That file couldn’t be read');rd.readAsText(f)});
if(APPP){APPP.addListener('backButton',()=>{if(!$('#xsheet').hidden)return ACT.xclose();if(!$('#rsheet').hidden)return ACT.rclose();const v=curView();if(v==='days'){location.hash='#programs';return}if(location.hash&&v!=='today'){location.hash='#today';return}try{APPP.minimizeApp()}catch(e){APPP.exitApp()}});
 APPP.addListener('appStateChange',st=>{if(st&&st.isActive){tickRest();if(Date.now()-UPD.t>6*36e5)checkUpdate(false)}})}
if(NATIVE&&Date.now()-UPD.t>6*36e5)setTimeout(()=>checkUpdate(false),1500);
render();setSync('local');tickRest();connect();
document.addEventListener('keydown',ev=>{if(ev.key!=='Escape')return;if(!$('#xsheet').hidden)ACT.xclose();else if(!$('#rsheet').hidden)ACT.rclose()});
})();
</script>
</body>
